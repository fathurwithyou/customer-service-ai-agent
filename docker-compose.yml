services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tokokita
      POSTGRES_PASSWORD: tokokita
      POSTGRES_DB: tokokita
    ports:
      # 5433 on the host: a locally installed Postgres commonly already holds 5432, and it
      # wins for `localhost`, so the container would be shadowed rather than refused.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokokita -d tokokita"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
