[project]
name = "tokokita-cs-agent"
version = "0.1.0"
description = "Customer service AI agent for the TokoKita marketplace."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "logfire[fastapi,httpx,sqlalchemy]>=4.39.0",
    "openinference-instrumentation-pydantic-ai>=0.1.18",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "pydantic-ai-slim[groq]>=2.22.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

# Standalone project: a stray pyproject.toml up the tree (~/Documents) would otherwise pull this
# into that workspace and resolve it against the wrong Python. An (empty) workspace declaration
# makes uv stop walking up.
[tool.uv.workspace]
members = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokokita"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.logfire]
# Tests exercise tools directly, without an app to configure tracing. The warning is noise there.
ignore_no_config = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# On top of ruff's defaults (E/F): import sorting, pyupgrade, and bugbear.
extend-select = ["I", "UP", "B", "PLC0415"]  # PLC0415: no imports inside functions

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is the FastAPI idiom, not the B008 mutable-default bug.
extend-immutable-calls = ["fastapi.Depends"]
